# Production: pulls the published images, nothing is built.
#
#   docker compose -f compose-prod.yml --env-file .env.prod up -d
#
# Variables (put them in .env.prod, never commit it):
#   REGISTRY           registry + namespace of the images (default: docker.io/danielrasho)
#   TAG                image tag to deploy (default: latest)
#   POSTGRES_PASSWORD  required
#   PUBLIC_URL         required, e.g. https://survey.example.com
#   ADMIN_USERNAME     required, admin account of the panel (created/updated at startup)
#   ADMIN_PASSWORD     required
#   SESSION_TTL_HOURS  how long a login lasts (default: 168)
#
# Only the client is reachable from outside, through nginx-proxy-manager
# (infra/nginx.yaml) on the external "proxy" network: point the proxy host to
# nixty-client:80. The client's nginx forwards /api to the server.
name: nixty-survey

services:
  client:
    image: ${REGISTRY:-docker.io/smaugtur}/nixty-survey-client:${TAG:-latest}
    pull_policy: always
    container_name: nixty-client
    restart: unless-stopped
    depends_on:
      - server  # nginx proxies /api to it and fails to start if it can't resolve it
    networks:
      - app-network
      - proxy
  server:
    image: ${REGISTRY:-docker.io/smaugtur}/nixty-survey-server:${TAG:-latest}
    pull_policy: always
    container_name: nixty-server
    restart: unless-stopped
    depends_on:
      - db
    networks:
      - app-network
    environment:
      # API
      API_PORT: "8080"
      # DB
      DB_URI: "postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/postgres"
      # LOGGING Configuration
      LOGGING_LEVEL: "info"
      LOGGING_PRETTY: "no"
      # CORS Configuration (the browser only talks to the client's nginx, this is a fallback)
      ALLOWED_ORIGINS: "${PUBLIC_URL:?PUBLIC_URL is required}"
      ALLOWED_CONTENT_TYPES: "application/json,text/plain"
      ALLOWED_METHODS: "GET,POST,PUT,DELETE,PATCH"
      ALLOWED_HEADERS: "Content-Type,Authorization"
      # ADMIN account, created (or its password updated) at startup
      ADMIN_USERNAME: "${ADMIN_USERNAME:?ADMIN_USERNAME is required}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}"
      # SESSIONS (the session cookie only travels over HTTPS)
      COOKIE_SECURE: "true"
      SESSION_TTL_HOURS: "${SESSION_TTL_HOURS:-168}"
  db:
    image: ${REGISTRY:-docker.io/smaugtur}/nixty-survey-db:${TAG:-latest}
    pull_policy: always
    container_name: nixty-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
  proxy:
    external: true

volumes:
  postgres_data:
