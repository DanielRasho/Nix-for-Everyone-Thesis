  # ==========================================================================
  # PP: read the code
  # ==========================================================================

  - id: PP4-1
    kind: choice_text
    prompt: Selecciona el valor final de `[ f, a ]` tras ser evaluado.
    code: |
      const f = (x: number) => x + 1
      const a = 1

      const result = [f, a]
    options:
      - { id: a, text: "`[ [Function: f], 1 ]`", correct: true }
      - { id: b, text: "`[ 2 ]`" }
      - { id: c, text: "`2`" }
      - { id: d, text: "`[ [Function: f] ]`" }
      - { id: e, text: "Error de evaluación" }

  - id: PP4-2
    optional: true
    kind: choice_text
    prompt: "Selecciona el resultado correcto para cuando se corre `nixty build greet` con el programa dado:"
    code: |
      const greet = new Package({
          name: "greet",
          systems: SYSTEMS,
          definition: (system) => ({
              version: "1.0.0",
              src: new Source(Path.fetchFromGithub({
                  owner: "example", repo: "greet", tag: "v1.0.0",
              })),
              deps: {
                  atBuild: NIX_PKGS.getPackages(["gcc"], system),
              },
              phases: (out) => ({
                  build: nix`gcc -O2 -o greet main.c`,
                  install: nix`
                      mkdir -p ${out}/bin
                      cp greet ${out}/bin/greet
                  `,
              }),
          }),
      })
    options:
      - id: a
        text: Nix compila usando el código fuente del directorio de trabajo actual en lugar de GitHub, ya que `fetchFromGithub` solo se usa con fines de documentación.
      - id: b
        correct: true
        text: Nix obtiene el código fuente de GitHub en el tag fijado (`v1.0.0`), y compila `main.c` con `gcc` y genera `bin/greet`.
      - id: c
        text: Nix crea un entorno de desarrollo (dev shell) con `gcc` disponible.
      - id: d
        text: Nix obtiene el código fuente, pero como no se proporcionó ningún hash, descarga siempre la versión más reciente del repositorio, ignorando el tag, y se ejecuta correctamente sin mostrar ningún error.
      - id: e
        text: Nix compila el programa correctamente, pero el binario resultante se llama main, no greet, porque ese es el nombre del archivo fuente (`main.c`).

  - id: PP5-1
    kind: choice_text
    prompt: "Identifica cuantas variables son accesibles desde el bloque señalado en el comentario:"
    code: |
        const outputs = (name: string) => {
            const a = "A"
            const b = "B"
            return {
                a: () => { const c = "C"; return d },
                b: () => {
                    const c = "D"
                    return {
                        // <= HERE
                    }
                },
            }
        }
    options:
      - { id: a, text: "6" }
      - { id: b, text: "7" }
      - { id: c, text: "8" }
      - { id: d, text: "5" }
      - { id: e, text: "4", correct: true}

