    code: |
      const a = 1
      const b = a + 2
      const c = b * 3
    options:
      - { id: a, text: "c → b → a" }
      - { id: b, text: "a → b → c", correct: true }
      - { id: c, text: "c & b → a" }
      - { id: d, text: "a & b & c" }
      - { id: e, text: "c & a → b" }

  - id: PP7-2
    optional: true
    kind: choice_text
    prompt: Indica cual será el resultado de evaluar el siguiente programa, **recuerda que TypeScript evalúa de forma estricta (_eager_)**.
    code: |
      const averages = [10 / 0, 0 / 0, -5 / 0]
      // Este cálculo tarda muchísimo
      let total = 0
      for (let n = 0; n < 5_000_000_000_000; n++) total += n

      const message = averages.length > 2
          ? "listo!"
          : total
    options:
      - { id: a, text: "Evalúa a `\"listo!\"`." }
      - { id: b, text: "Falla por división por cero." }
