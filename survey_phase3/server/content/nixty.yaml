# Nixty survey: nix.yaml with every task written in Nixty (TypeScript).
#
# - Keep it equivalent to nix.yaml: same question ids, order, prompts and correct option. The
#   code is the same program written in TypeScript, so where TypeScript evaluates differently the
#   answer follows TypeScript: PP7-1 (eager: b) and PP7-2 (computes x: e).
# - Question and option ids must not change once participants start: answers reference them.
# - Prompts and option texts are Markdown. Quote option texts that start with a backtick.
# - "{tool}" is replaced by `tool` (here and in feedback.yaml).
# - "{codespace}" is replaced by `codespace` (only here, not in feedback.yaml).
# - The `code` of PE9-1, PE10-1 and PE11-1 must equal the Codespaces repo's
#   tasks/nixty/*/starter.ts (PE9-1 also nixty/nixty.ts).
title: Nixty
tool: Nixty
language: typescript
# Codespaces repo: DanielRasho/Thesis-survey, config .devcontainer/<survey>/devcontainer.json.
# quickstart=1 resumes the participant's codespace instead of creating a second one.
codespace: https://codespaces.new/DanielRasho/Thesis-codespaces?quickstart=1&devcontainer_path=.devcontainer/nixty/devcontainer.json

questions:
  - id: instructions
    kind: info
    prompt: |
      ## Instrucciones

      Se te presentaran una serie de ejercicios para poner a prueba tu aprendizaje en **{tool}**.

      Durante la prueba puedes consultar el contenido de aprendizaje dado por el investigador, como buscar por internet, más **no se permite el uso de asistentes de inteligencia artificial**.

  # ==========================================================================
  # PA: choose the code
  # ==========================================================================

  - id: PA1-1
    kind: choice_code
    prompt: Escoge el código correcto (Sin errores sintácticos).
    options:
      - id: a
        code: |
          import { Definition, DevShell, Nixpkgs, System } from "nixty-lib"

          const NIX_PKGS = new Nixpkgs({ tag: "nixos-unstable" })

          const dev = new DevShell({
              name: "default"
              systems: [System.x86_64Linux]
              packages: (system) => NIX_PKGS.getPackages(
                ["python3", "git"], system)
              onEnter: `echo "Welcome to the dev shell"`
          })
      - id: b
        code: |
          import { Definition, DevShell, Nixpkgs, System } from "nixty-lib"

