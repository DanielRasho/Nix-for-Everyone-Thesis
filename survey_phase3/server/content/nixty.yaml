    options:
      - { id: a, text: "`x` es una función | `y` es un número | `z` es un objeto | `a` es una función." }
      - { id: b, text: "`x` es una función | `y` es un número | `z` es un número | `a` es una función.", correct: true }
      - { id: c, text: "`x` es un objeto | `y` es una función | `z` es un número | `a` es un tipo cualquiera." }
      - { id: d, text: "`x` es una función | `y` es un objeto | `z` es un número | `a` es una función." }
      - { id: e, text: "`x` es una función | `y` es un número | `z` es un número | `a` es un objeto." }

  - id: PP6-1
