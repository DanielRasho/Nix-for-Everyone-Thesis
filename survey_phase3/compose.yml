# Local / development: every image is built from this repo, nothing is pulled.
# Production uses compose-prod.yml, which pulls the published images instead.
name: nixty-survey

services:
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    pull_policy: build
    container_name: nixty-client
    ports:
      - "8080:80"
    restart: unless-stopped
    depends_on:
      - server  # nginx proxies /api to it and fails to start if it can't resolve it
    networks:
      - app-network
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    pull_policy: build
    container_name: nixty-server
    ports:
      - "3003:8080"
    restart: unless-stopped
    depends_on:
      - db
    networks:
      - app-network
    environment:
      # API
      API_PORT: "8080"
      # DB
      DB_URI: "postgresql://postgres:postgres@db:5432/postgres"
      # LOGGING Configuration
      LOGGING_LEVEL: "debug"
      LOGGING_PRETTY: "yes"
      # CORS Configuration
      ALLOWED_ORIGINS: "http://localhost:3001,http://localhost:3000,http://example.com"
      ALLOWED_CONTENT_TYPES: "application/json,text/plain"
      ALLOWED_METHODS: "GET,POST,PUT,DELETE,PATCH"
      ALLOWED_HEADERS: "Content-Type,Authorization"
      # ADMIN account, created (or its password updated) at startup
      ADMIN_USERNAME: "admin"
      ADMIN_PASSWORD: "admin-dev-password"
      # SESSIONS
      COOKIE_SECURE: "false"  # plain http on localhost
      SESSION_TTL_HOURS: "168"
  db:
    build:
      context: ./db/
      dockerfile: Dockerfile
    pull_policy: build
    container_name: nixty-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:

volumes:
  postgres_data:
