  # ==========================================================================
  # PP: read the code
  # ==========================================================================

  - id: PP4-1
    kind: choice_text
    prompt: Selecciona el valor final de `[ f a ]` tras ser evaluado.
    code: |
      let
        f = x: x + 1;
        a = 1;
      in [ f a ]
    options:
      - { id: a, text: "`[ <lambda> 1 ]`", correct: true }
      - { id: b, text: "`[ 2 ]`" }
      - { id: c, text: "`2`" }
      - { id: d, text: "`[ <lambda> ]`" }
      - { id: e, text: "Error de evaluación" }

  - id: PP4-2
    kind: choice_text
    prompt: "Selecciona el resultado correcto para cuando se corre `nix build .#default` con el programa dado:"
    code: |
      packages.${system}.default = pkgs.stdenv.mkDerivation {
        pname = "greet";
        version = "1.0.0";
        src = pkgs.fetchFromGitHub {
          owner = "example"; repo = "greet"; rev = "v1.0.0"; sha256 = "AAAA...";
        };
        nativeBuildInputs = [ pkgs.gcc ];
        buildPhase = ''gcc -O2 -o greet main.c'';
        installPhase = ''
          mkdir -p $out/bin
          cp greet $out/bin/greet
        '';
      };
    options:
      - id: a
        text: Nix compila usando el código fuente del directorio de trabajo actual en lugar de GitHub, ya que `fetchFromGitHub` solo se usa con fines de documentación.
      - id: b
        correct: true
        text: Nix obtiene el código fuente de GitHub en la revisión fijada, lo verifica con el hash sha256 proporcionado, compila main.c con gcc y genera un enlace simbólico que apunta a una ruta de almacenamiento que contiene `bin/greet`.
      - id: c
        text: Nix crea un entorno de desarrollo (dev shell) con `gcc` disponible.
      - id: d
        text: Nix obtiene el código fuente, pero omite la verificación del hash porque sha256 es un valor de marcador de posición, y se ejecuta correctamente sin mostrar ningún error, independientemente del contenido real.
      - id: e
        text: Nix compila el programa correctamente, pero el binario resultante se llama main, no greet, porque ese es el nombre del archivo fuente (`main.c`).

