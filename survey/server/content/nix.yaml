      - { id: c, text: "Falla por variable indefinida." }
      - { id: d, text: "Evalúa a `\"it's all good!\"`, pero porque Nix elimina automáticamente la rama else no usada." }
      - { id: e, text: "Tarda mucho en responder, porque Nix calcula `x`." }

  # TODO: no option was marked in the .typ, and two options were labelled "a)".
  # Relabelled a-e in order; `d` is the one that matches `nix eval`.
  - id: PP8-1
    kind: choice_code
    prompt: Indica cual será el resultado de la siguiente operación.
    code: |
      let
        numbers = [ 1 2 3 ];
        labels = [
          { name = "a"; value = 1; }
          { name = "b"; value = 2; }
        ];
      in
      {
        # map aplica una función a cada elemento de una lista,
        # devolviendo una nueva lista con los resultados
        a = map (n: n * 2) numbers;

        # listToAttrs convierte una lista de { name = ...; value = ...; }
        # en un attribute set, usando `name` como clave y `value` como valor
        b = builtins.listToAttrs labels;
      }
    options:
      - id: a
        code: |
          {
            a = [ 1 2 3 ];
            b = [ { name = "a"; value = 1; } { name = "b"; value = 2; } ];
          }
      - id: b
        code: |
          {
            a = [ 2 4 6 ];
            b = [ 1 2 ];
          }
      - id: c
        code: |
          {
            a = 6;
            b = { a = 1; b = 2; };
          }
      - id: d
        correct: true
        code: |
          {
            a = [ 2 4 6 ];
            b = { a = 1; b = 2; };
          }
      - id: e
        code: |
          {
            a = [ 2 4 6 ];
            b = { name = "b"; value = 2; };
          }

  # TODO: no option was marked in the .typ; `a` is the one that matches `nix eval`.
  - id: PP8-2
    kind: choice_code
    prompt: Indica cual será el resultado de la siguiente operación. Revisar el ejercicio anterior te puede ayudar a comprender el comportamiento de `map` y `builtins.listToAttrs`.
    code: |
      let
        inventoryCreator =
          items: # Lista de nombres de items.
          # El resultado de map es dado a la funcion listToAttrs.
          (builtins.listToAttrs (
            map (item: {
              name = item;    # Nombre del elemento;
              quantity = 100; # Cantidad de dicho item;
            }) items
          ));
      in
      inventoryCreator [ "banana" "apple" ]
    options:
      - id: a
        correct: true
        code: |
          error: attribute 'value' missing
      - id: b
        code: |
          { banana = 100; apple = 100; }
      - id: c
        code: |
          [
            { name = "banana"; quantity = 100; }
            { name = "apple"; quantity = 100; }
          ]
      - id: d
        code: |
          { banana = null; apple = null; }
      - id: e
        code: |
          { name = "apple"; quantity = 100; }

