  - id: PA3-1
    kind: choice_code
    prompt: |
      Selecciona el programa correcto con el resultado solicitado.

      _"Dado `x = 10`, seleciona el programa que evalúa correctamente a "grande"."_
    options:
      - id: a
        correct: true
        code: |
          let
            x = 10;
          in
          if x < 5 then "pequeño"
          else if x < 10 then "mediano"
          else "grande"
      - id: b
        code: |
          let
            x = 10;
          in
          if x < 5 then "pequeño"
          else if x <= 10 then "mediano"
          else "grande"
      - id: c
        code: |
          let
            x = 10;
          in
          if x > 10 then "grande"
          else if x > 5 then "mediano"
          else "pequeño"
      - id: d
