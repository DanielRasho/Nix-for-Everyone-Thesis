  - id: PP7-1
    kind: choice_text
    prompt: En qué orden crees que se van a evaluar los diferentes atributos de esta expresión, **recuerda que Nix evalúa perezosamente**.
    code: |
      let
        content = rec {
          a = 1;
          b = a + 2;
          c = b * 3;
        };
      in
      content.c # La evaluación empieza aquí.
    options:
      - { id: a, text: "c → b → a", correct: true }
      - { id: b, text: "a → b → c" }
      - { id: c, text: "c & b → a" }
      - { id: d, text: "a & b & c" }
      - { id: e, text: "c & a → b" }

