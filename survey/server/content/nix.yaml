# Nix survey. Source: annex/4/questionary_phase3.typ
#
# - Question and option ids must not change once participants start: answers reference them.
# - Prompts and option texts are Markdown. Quote option texts that start with a backtick.
# - "{tool}" is replaced by `tool` (here and in feedback.yaml).
# - "{codespace}" is replaced by `codespace` (only here, not in feedback.yaml).
title: Nix
tool: NixLang
language: nix
# Codespaces repo: DanielRasho/Thesis-survey, config .devcontainer/<survey>/devcontainer.json.
# quickstart=1 resumes the participant's codespace instead of creating a second one.
codespace: https://codespaces.new/DanielRasho/Thesis-codespaces?quickstart=1&devcontainer_path=.devcontainer/nix/devcontainer.json

questions:
  - id: instructions
    kind: info
    prompt: |
      ## Instrucciones

      Se te presentaran una serie de ejercicios para poner a prueba tu aprendizaje en {tool}. Durante la prueba puedes consultar el contenido de aprendizaje dado por los investigadores, como buscar por internet, más no se permite el uso de asistentes de inteligencia artificial.

