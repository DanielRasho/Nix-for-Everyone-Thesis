<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Encuesta Nixty</title>
    <script>
      // Apply the saved theme before the first paint (avoids a light flash in dark mode).
      // Must match STORAGE_KEY in src/lib/theme.ts.
      ;(function () {
        var theme = 'system'
        try {
          theme = localStorage.getItem('survey-theme') || 'system'
        } catch (e) {}
        var dark =
          theme === 'dark' ||
          (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.add(dark ? 'dark' : 'light')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
